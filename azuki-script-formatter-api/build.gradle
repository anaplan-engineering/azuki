plugins {
    id 'azuki.kotlin-conventions'
    id 'azuki.jar-publishing-conventions'
}

dependencies {
    implementation libs.slf4j.api
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Azuki Script Formatter API'
                description = 'Tools to assist with formatting Azuki scenario scripts'
            }
        }
    }
}
