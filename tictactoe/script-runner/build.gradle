plugins {
    id 'azuki.kotlin-conventions'
    id "com.anaplan.engineering.vdm-stub-generator"
}

configurations {
    runner.extendsFrom runtime
    sampleImpl
    vdm
    kazuki
}

dependencies {
    runner project(":azuki-runner")

    implementation project(":tictactoe:dsl")
    implementation project(":tictactoe:adapter-script-generation")
    implementation project(":azuki-runner")
    implementation project(":azuki-script-generation")
    implementation 'com.github.ajalt.clikt:clikt-jvm:5.0.3'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.0.21"
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.12.7'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.17.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'

    sampleImpl project(":tictactoe:adapter-implementation")
    sampleImpl project(":tictactoe:implementation")
    sampleImpl project(":tictactoe:implementation-v2")
    vdm project(":tictactoe:adapter-vdm")
    kazuki project(":tictactoe:adapter-kazuki")
    kazuki project(":tictactoe:kazuki")
}

task sampleImplClasspathJar(type: Jar) {
    dependsOn configurations.sampleImpl
    archiveBaseName = 'SampleImpl'
    manifest {
        attributes(
            "Class-Path": configurations.sampleImpl.collect { it.absolutePath }.join(' '))
    }
}

task kazukiClasspathJar(type: Jar) {
    dependsOn configurations.kazuki
    archiveBaseName = 'Kazuki'
    manifest {
        attributes(
            "Class-Path": configurations.kazuki.collect { it.absolutePath }.join(' '))
    }
}

task vdmClasspathJar(type: Jar) {
    dependsOn configurations.vdm
    archiveBaseName = 'VDM'
    manifest {
        attributes(
            "Class-Path": configurations.vdm.collect { it.absolutePath }.join(' '))
    }
}

ext {
    scenarioFile = project.findProperty("scenarioFile") ?: "script.scn"
    oracleScenarioFile = project.findProperty("oracleScenarioFile") ?: "oracle_script.scn"
}

task runScript(type: JavaExec) {
    dependsOn vdmClasspathJar
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.anaplan.engineering.azuki.tictactoe.scriptrunner.TicTacToeScenarioScriptRunnerKt'
    jvmArgs '-Xmx4g', "--add-opens=java.base/java.nio=ALL-UNNAMED"
    args = [
        "-d", file("build/run${System.currentTimeMillis()}").absolutePath,
        "-v", file("build/verified").absolutePath,
        "-u", file("build/unverified").absolutePath,
        "-i", file("config/imports").absolutePath,
        "-t", "VDM",
        file(scenarioFile).absolutePath,
    ]
    def instanceJars = [
        vdmClasspathJar.archiveFile.get().asFile.absolutePath,
    ]
    systemProperties = [
        "com.anaplan.engineering.azuki.implementation.instance.jars": instanceJars.join(","),
    ]
}

task runOracleScript(type: JavaExec) {
    dependsOn sampleImplClasspathJar
    dependsOn kazukiClasspathJar
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.anaplan.engineering.azuki.tictactoe.scriptrunner.TicTacToeScenarioScriptRunnerKt'
    jvmArgs '-Xmx4g', "--add-opens=java.base/java.nio=ALL-UNNAMED"
    args = [
        "-d", file("build/run${System.currentTimeMillis()}").absolutePath,
        "-v", file("build/verified").absolutePath,
        "-u", file("build/unverified").absolutePath,
        "-i", file("config/imports").absolutePath,
        "-t", "SampleImpl",
        "-o", "Kazuki",
        file(oracleScenarioFile).absolutePath,
    ]
    def instanceJars = [
        sampleImplClasspathJar.archiveFile.get().asFile.absolutePath,
        kazukiClasspathJar.archiveFile.get().asFile.absolutePath,
    ]
    systemProperties = [
        "com.anaplan.engineering.azuki.implementation.instance.jars": instanceJars.join(','),
    ]
}



