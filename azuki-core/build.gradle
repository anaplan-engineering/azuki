plugins {
    id 'azuki.kotlin-conventions'
    id 'azuki.jar-publishing-conventions'
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-test-junit'
    implementation libs.kotlinx.coroutines.core
    implementation libs.jackson.module
    implementation 'org.semver4j:semver4j:5.2.2'
    implementation libs.slf4j.api

    runtimeOnly 'org.jetbrains.kotlin:kotlin-compiler-embeddable'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-common'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-jvm'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-jvm-host'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Azuki'
                description = 'The core library of the Azuki framework for behaviour driven specification'
            }
        }
    }
}

