plugins {
    id 'azuki.kotlin-conventions'
    id 'azuki.jar-publishing-conventions'
}

dependencies {
    // 1.5.0+ require Kotlin 2.1
    implementation 'com.pinterest.ktlint:ktlint-rule-engine:1.4.0'
    implementation 'com.pinterest.ktlint:ktlint-ruleset-standard:1.4.0'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Azuki Script Formatter'
                description = 'Tools to assist with formatting Azuki scenario scripts'
            }
        }
    }
}
